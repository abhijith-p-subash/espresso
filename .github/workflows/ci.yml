name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # One version per extra OS is enough; the full sweep runs on Linux.
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-ayatanaappindicator3-0.1 libcairo2-dev libgirepository1.0-dev

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # The suite is headless by design: tests/conftest.py forces
        # PYSTRAY_BACKEND=dummy so no display server is required.
        run: pytest -v

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-ayatanaappindicator3-0.1 libcairo2-dev libgirepository1.0-dev

      - run: pip install -e ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller Espresso.spec --noconfirm

      - name: Check the artefact exists
        shell: bash
        run: ls -la dist/
